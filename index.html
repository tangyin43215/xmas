<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>GitHub Pages 摄像头测试</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
html, body {
margin: 0;
padding: 0;
height: 100%;
font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
background: #0b1116;
color: #f5f5f5;
display: flex;
flex-direction: column;
align-items: center;
justify-content: flex-start;
}
h1 {
font-size: 20px;
margin: 20px 0 8px;
}
p {
font-size: 14px;
margin: 4px 0 12px;
text-align: center;
padding: 0 16px;
}
video {
width: 90vw;
max-width: 420px;
max-height: 60vh;
background: #000;
border-radius: 16px;
border: 2px solid #394957;
box-shadow: 0 0 20px rgba(0,0,0,0.8);
}
</style>
</head>
<body>
<h1>GitHub Pages 摄像头测试</h1>
<p id="status">正在请求摄像头权限...</p>
<video id="video" autoplay playsinline muted></video>

<script>
const statusEl = document.getElementById("status");
const video = document.getElementById("video");

async function startCamera() {
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
statusEl.textContent = "浏览器不支持摄像头 API。";
return;
}
try {
statusEl.textContent = "正在请求摄像头，请在弹出的提示中选择“允许”。";
const stream = await navigator.mediaDevices.getUserMedia({
video: { facingMode: "user" },
audio: false
});
video.srcObject = stream;
statusEl.textContent = "摄像头已启动，如果看不到画面，请检查系统设置。";
} catch (err) {
console.warn("getUserMedia error", err);
statusEl.textContent = "获取摄像头失败：" + (err.name || err.message || "未知错误");
}
}

startCamera();
</script>
</body>
</html>
