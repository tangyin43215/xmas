<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Gesture Christmas Tree - Three.js + MediaPipe Hands</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

html, body {
width: 100%;
height: 100%;
overflow: hidden;
font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
background: radial-gradient(circle at top, #172c24 0%, #050810 50%, #020307 100%);
color: #f8f3e3;
}

#app {
width: 100%;
height: 100%;
position: relative;
}

canvas {
display: block;
}

/* 顶部信息条 */
.hud {
position: absolute;
top: 16px;
left: 50%;
transform: translateX(-50%);
padding: 10px 16px;
border-radius: 999px;
background: rgba(5, 10, 12, 0.85);
backdrop-filter: blur(12px);
box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
display: flex;
align-items: center;
gap: 12px;
pointer-events: none;
border: 1px solid rgba(210, 170, 95, 0.3);
}

.hud-dot {
width: 9px;
height: 9px;
border-radius: 999px;
background: radial-gradient(circle, #ffd87a 0%, #ff9c3b 45%, #c26222 100%);
box-shadow: 0 0 16px rgba(255, 174, 57, 0.8);
}

.hud-main {
font-size: 13px;
letter-spacing: 0.03em;
text-transform: uppercase;
color: #f7e9cc;
}

.hud-state {
font-size: 11px;
padding: 3px 8px;
border-radius: 999px;
border: 1px solid rgba(252, 244, 214, 0.18);
background: linear-gradient(135deg, rgba(13, 41, 33, 0.95), rgba(130, 33, 33, 0.9));
}

/* 右下角控制面板 */
.panel {
position: absolute;
right: 16px;
bottom: 16px;
padding: 14px 16px 12px;
border-radius: 18px;
background: radial-gradient(circle at top left, rgba(40, 63, 54, 0.9), rgba(6, 12, 15, 0.98));
border: 1px solid rgba(215, 186, 120, 0.4);
box-shadow:
0 18px 45px rgba(0, 0, 0, 0.9),
0 0 40px rgba(210, 190, 120, 0.25);
min-width: 240px;
}

.panel-title {
font-size: 13px;
font-weight: 600;
margin-bottom: 6px;
color: #f7edd7;
display: flex;
align-items: center;
justify-content: space-between;
gap: 8px;
}

.panel-title span {
font-size: 11px;
font-weight: 500;
color: #d0c8ad;
}

.panel-section {
margin-top: 8px;
font-size: 11px;
color: #f2e9d5;
line-height: 1.6;
}

.panel-section b {
color: #ffe6a4;
font-weight: 600;
}

.badge {
display: inline-flex;
align-items: center;
gap: 4px;
padding: 4px 7px;
border-radius: 999px;
border: 1px solid rgba(255, 230, 164, 0.5);
background: linear-gradient(135deg, rgba(161, 119, 52, 0.2), rgba(232, 196, 128, 0.05));
font-size: 10px;
margin-bottom: 4px;
}

.badge-dot {
width: 6px;
height: 6px;
border-radius: 999px;
background: radial-gradient(circle, #ffe0a2 0%, #ffb547 55%, #c78124 100%);
box-shadow: 0 0 12px rgba(255, 191, 81, 0.85);
}

.file-input-wrapper {
margin-top: 8px;
display: flex;
flex-direction: column;
gap: 4px;
}

.file-input-wrapper label {
font-size: 11px;
color: #e6dac0;
}

.file-input-wrapper input[type="file"] {
font-size: 10px;
color: #f8f4e6;
background: rgba(7, 18, 15, 0.95);
border-radius: 999px;
border: 1px solid rgba(207, 183, 118, 0.7);
padding: 4px 8px;
}

/* 左下角摄像头小窗（可隐藏） */
#videoWrapper {
position: absolute;
left: 16px;
bottom: 16px;
width: 170px;
height: 110px;
border-radius: 14px;
overflow: hidden;
border: 1px solid rgba(209, 186, 127, 0.5);
box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9);
background: radial-gradient(circle at top, #2a3a32 0%, #05080e 60%);
}

#input_video {
width: 100%;
height: 100%;
object-fit: cover;
transform: scaleX(-1); /* 镜像以符合直觉 */
}

.video-label {
position: absolute;
left: 10px;
bottom: 6px;
font-size: 10px;
padding: 2px 6px;
border-radius: 999px;
background: rgba(3, 10, 9, 0.8);
border: 1px solid rgba(196, 168, 110, 0.6);
color: #f5e9d0;
}

/* 中央提示文案（初次提示） */
.hint {
position: absolute;
left: 50%;
top: 50%;
transform: translate(-50%, -50%);
font-size: 14px;
text-align: center;
letter-spacing: 0.1em;
text-transform: uppercase;
color: rgba(251, 238, 210, 0.9);
text-shadow: 0 0 40px rgba(255, 220, 170, 0.75);
pointer-events: none;
opacity: 0;
transition: opacity 0.5s ease;
}

.hint.visible {
opacity: 1;
}

.hint small {
display: block;
margin-top: 8px;
font-size: 11px;
opacity: 0.9;
}

@media (max-width: 768px) {
.panel {
right: 10px;
bottom: 10px;
scale: 0.93;
transform-origin: right bottom;
}
#videoWrapper {
left: 10px;
bottom: 10px;
width: 150px;
height: 100px;
}
.hud {
top: 10px;
}
}
</style>
</head>
<body>
<div id="app">
<!-- Three.js 会把 canvas 注入到这里 -->
<div class="hud">
<div class="hud-dot"></div>
<div class="hud-main">Hand-Controlled Christmas Tree</div>
<div id="hudState" class="hud-state">STATE · TREE</div>
</div>

<div class="panel">
<div class="panel-title">
手势控制说明
<span>Three.js · MediaPipe Hands</span>
</div>

<div class="badge">
<div class="badge-dot"></div>
<span>摄像头开启后抬起你的手</span>
</div>

<div class="panel-section">
<b>🤜 握拳</b>：树合拢，回到金字塔形圣诞树。<br/>
<b>🖐 张开五指</b>：树散开，粒子和装饰物在空间漂浮。<br/>
<b>👋 移动手掌</b>：在散开态中旋转视角。<br/>
<b>🤏 抓 / 捏</b>：抓住一张照片，在前景放大展示。<br/>
</div>

<div class="panel-section file-input-wrapper">
<label for="photoInput">上传照片（构成照片云）</label>
<input id="photoInput" type="file" accept="image/*" multiple />
</div>
</div>

<div id="videoWrapper">
<video id="input_video" playsinline></video>
<div class="video-label">Camera · Hands</div>
</div>

<div id="hint" class="hint">
RAISE YOUR HAND<br/>TO AWAKEN THE TREE
<small>允许摄像头 → 张开五指 / 握拳 / 捏合</small>
</div>
</div>

<!-- MediaPipe Hands & Camera Utils -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<!-- Three.js & 后期处理（ES Modules） -->
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { EffectComposer } from "https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js";
import { RenderPass } from "https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js";

// ========= DOM & UI =========
const container = document.getElementById("app");
const hudStateEl = document.getElementById("hudState");
const hintEl = document.getElementById("hint");
const photoInput = document.getElementById("photoInput");
const videoElement = document.getElementById("input_video");

// ========= Three.js 基础 =========
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = null;
scene.fog = new THREE.FogExp2(0x020509, 0.045);

const camera = new THREE.PerspectiveCamera(
45,
window.innerWidth / window.innerHeight,
0.1,
200
);
camera.position.set(0, 5, 18);

// 相机极坐标（用于手势控制）
let camRadius = 18;
let camTheta = Math.PI / 5; // 水平方向角度
let camPhi = 1.1; // 垂直方向角度
let camThetaTarget = camTheta;
let camPhiTarget = camPhi;
const baseTheta = camTheta;
const basePhi = camPhi;

// ========= 后期处理：辉光 =========
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

const bloomPass = new UnrealBloomPass(
new THREE.Vector2(window.innerWidth, window.innerHeight),
1.4, // strength
0.85, // radius
0.1 // threshold
);
composer.addPass(bloomPass);

// ========= 灯光 =========
scene.add(new THREE.AmbientLight(0x34382f, 0.9));

const warmKey = new THREE.PointLight(0xffe0aa, 1.2, 60);
warmKey.position.set(10, 18, 8);
scene.add(warmKey);

const fill = new THREE.PointLight(0xbad2ff, 0.4, 50);
fill.position.set(-8, 6, -12);
scene.add(fill);

const rim = new THREE.PointLight(0xff6a6a, 0.7, 50);
rim.position.set(0, 10, -14);
scene.add(rim);

// ========= 圣诞树参数 =========
const TREE_HEIGHT = 10;
const TREE_RADIUS = 4.2;
const ORNAMENT_COUNT = 120;
const PARTICLE_COUNT = 600;

const ornaments = []; // { mesh, treePos, scatterPos, type }
const photoMeshes = []; // Mesh 列表，用于点击/抓取
let focusPlane = null; // 前景放大照片
let focusTexture = null;

// 粒子树（两套形状，用于插值）
const particleGeom = new THREE.BufferGeometry();
const particleTreePositions = new Float32Array(PARTICLE_COUNT * 3);
const particleScatterPositions = new Float32Array(PARTICLE_COUNT * 3);
const particlePositions = new Float32Array(PARTICLE_COUNT * 3);

// ========= 工具函数 =========
function randInRange(min, max) {
return min + Math.random() * (max - min);
}

function randomConePosition(height, radius) {
const h = Math.random(); // 0-1
const y = h * height;
const r = radius * (1 - h * 0.9); // 越靠上越细
const theta = Math.random() * Math.PI * 2;
const x = Math.cos(theta) * r;
const z = Math.sin(theta) * r;
return new THREE.Vector3(x, y, z);
}

function randomSpherePosition(radius) {
const u = Math.random();
const v = Math.random();
const theta = 2 * Math.PI * u;
const phi = Math.acos(2 * v - 1);
const r = radius * Math.cbrt(Math.random());
const x = r * Math.sin(phi) * Math.cos(theta);
const y = r * Math.cos(phi);
const z = r * Math.sin(phi) * Math.sin(theta);
return new THREE.Vector3(x, y, z);
}

// ========= 创建粒子圣诞树 =========
function createParticleTree() {
const positions = particlePositions;
for (let i = 0; i < PARTICLE_COUNT; i++) {
const treePos = randomConePosition(TREE_HEIGHT, TREE_RADIUS * 1.1);
const scatterPos = randomSpherePosition(10);

particleTreePositions[i * 3] = treePos.x;
particleTreePositions[i * 3 + 1] = treePos.y;
particleTreePositions[i * 3 + 2] = treePos.z;

particleScatterPositions[i * 3] = scatterPos.x;
particleScatterPositions[i * 3 + 1] = scatterPos.y;
particleScatterPositions[i * 3 + 2] = scatterPos.z;

// 初始放在树形
positions[i * 3] = treePos.x;
positions[i * 3 + 1] = treePos.y;
positions[i * 3 + 2] = treePos.z;
}

particleGeom.setAttribute(
"position",
new THREE.BufferAttribute(positions, 3)
);

const particleMat = new THREE.PointsMaterial({
size: 0.12,
sizeAttenuation: true,
color: new THREE.Color(0xfff6da),
transparent: true,
opacity: 0.8,
depthWrite: false,
blending: THREE.AdditiveBlending
});

const points = new THREE.Points(particleGeom, particleMat);
points.position.y = 0.5;
scene.add(points);
}

// ========= 装饰物 =========
function addOrnament(mesh, treePos, scatterPos) {
mesh.position.copy(treePos);
scene.add(mesh);
ornaments.push({
mesh,
treePos,
scatterPos,
wiggleOffset: Math.random() * Math.PI * 2
});
}

function createOrnaments() {
const gold = 0xd6b15f;
const red = 0xc92c3b;
const matteGreen = 0x14392e;

const ballGeom = new THREE.SphereGeometry(0.32, 24, 24);
const cubeGeom = new THREE.BoxGeometry(0.42, 0.42, 0.42);

const matGold = new THREE.MeshStandardMaterial({
color: gold,
metalness: 0.95,
roughness: 0.2,
emissive: 0x997531,
emissiveIntensity: 0.2
});
const matRed = new THREE.MeshStandardMaterial({
color: red,
metalness: 0.7,
roughness: 0.35,
emissive: 0x4a0b0b,
emissiveIntensity: 0.35
});
const matGreen = new THREE.MeshStandardMaterial({
color: matteGreen,
metalness: 0.4,
roughness: 0.45,
emissive: 0x061411,
emissiveIntensity: 0.25
});

// 球和方块
for (let i = 0; i < ORNAMENT_COUNT; i++) {
const isBall = i % 2 === 0;
const geom = isBall ? ballGeom : cubeGeom;
const mat = isBall
? (i % 4 === 0 ? matRed : matGold)
: (i % 3 === 0 ? matGreen : matRed);
const mesh = new THREE.Mesh(geom, mat);

const treePos = randomConePosition(TREE_HEIGHT, TREE_RADIUS * 0.95);
const scatterPos = randomSpherePosition(10);

addOrnament(mesh, treePos, scatterPos);
}

// 糖果棍
const caneCount = 18;
const caneStemGeom = new THREE.CylinderGeometry(0.08, 0.08, 1.4, 16);
const caneArcGeom = new THREE.TorusGeometry(0.34, 0.08, 12, 30, Math.PI);
const whiteMat = new THREE.MeshStandardMaterial({
color: 0xfaf3ec,
metalness: 0.3,
roughness: 0.3,
emissive: 0x35211e,
emissiveIntensity: 0.4
});
const redMat = new THREE.MeshStandardMaterial({
color: red,
metalness: 0.7,
roughness: 0.35,
emissive: 0x4a0b0b,
emissiveIntensity: 0.5
});

for (let i = 0; i < caneCount; i++) {
const group = new THREE.Group();

const stem = new THREE.Mesh(caneStemGeom, whiteMat);
stem.position.y = -0.3;
group.add(stem);

const arc = new THREE.Mesh(caneArcGeom, redMat);
arc.rotation.z = Math.PI / 2;
arc.position.y = 0.6;
group.add(arc);

const treePos = randomConePosition(TREE_HEIGHT * 0.8, TREE_RADIUS * 0.8);
const scatterPos = randomSpherePosition(10);

group.rotation.y = Math.random() * Math.PI * 2;

addOrnament(group, treePos, scatterPos);
}

// 树干
const trunkGeom = new THREE.CylinderGeometry(0.7, 0.9, 2, 16);
const trunkMat = new THREE.MeshStandardMaterial({
color: 0x3a2517,
metalness: 0.2,
roughness: 0.8
});
const trunk = new THREE.Mesh(trunkGeom, trunkMat);
trunk.position.y = -1;
scene.add(trunk);

// 顶部金色星形（用多面体代替）
const starGeom = new THREE.IcosahedronGeometry(0.9, 0);
const starMat = new THREE.MeshStandardMaterial({
color: gold,
metalness: 1,
roughness: 0.2,
emissive: 0xffe7a2,
emissiveIntensity: 0.9
});
const star = new THREE.Mesh(starGeom, starMat);
star.position.set(0, TREE_HEIGHT + 0.4, 0);
star.userData.isStar = true;

const starTreePos = star.position.clone();
const starScatterPos = randomSpherePosition(9);
addOrnament(star, starTreePos, starScatterPos);
}

// ========= 照片云 =========
const photoLoader = new THREE.TextureLoader();

function createPhotoMesh(texture) {
texture.encoding = THREE.sRGBEncoding;
texture.anisotropy = 8;

const mat = new THREE.MeshStandardMaterial({
map: texture,
metalness: 0.3,
roughness: 0.7,
emissive: new THREE.Color(0x442013),
emissiveIntensity: 0.35,
side: THREE.FrontSide
});

const aspect = texture.image.width / texture.image.height;
const baseHeight = 1.6;
const baseWidth = baseHeight * aspect;

const geom = new THREE.PlaneGeometry(baseWidth, baseHeight, 1, 1);

const mesh = new THREE.Mesh(geom, mat);

const treePos = randomConePosition(TREE_HEIGHT * 0.9, TREE_RADIUS * 0.9);
treePos.y += 0.3;
const scatterPos = randomSpherePosition(9);

mesh.position.copy(treePos);
mesh.lookAt(0, TREE_HEIGHT / 2, 0);
mesh.userData.isPhoto = true;

addOrnament(mesh, treePos, scatterPos);
photoMeshes.push(mesh);
}

function initFocusPlane() {
const geom = new THREE.PlaneGeometry(4, 5.4, 1, 1);
const mat = new THREE.MeshBasicMaterial({
color: 0xffffff,
transparent: true,
opacity: 0,
depthTest: true
});
focusPlane = new THREE.Mesh(geom, mat);
focusPlane.position.set(0, 3.2, 6.5);
scene.add(focusPlane);
}

// 处理用户上传照片
photoInput.addEventListener("change", (e) => {
const files = Array.from(e.target.files || []);
files.forEach((file) => {
if (!file.type.startsWith("image/")) return;
const url = URL.createObjectURL(file);
photoLoader.load(
url,
(texture) => {
createPhotoMesh(texture);
},
undefined,
(err) => {
console.warn("Failed to load photo", err);
}
);
});
// 允许多次上传
e.target.value = "";
});

// ========= 手势识别状态 =========
let hasHand = false;
let lastHandTime = 0;
let handCenter = { x: 0.5, y: 0.5 };

let openCounter = 0;
let fistCounter = 0;
let pinchCounter = 0;
const GESTURE_THRESHOLD = 6; // 连续帧数过滤抖动

// Mediapipe Hands 初始化
const hands = new Hands({
locateFile: (file) =>
`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
maxNumHands: 1,
minDetectionConfidence: 0.65,
minTrackingConfidence: 0.65,
modelComplexity: 1
});

hands.onResults(onHandsResults);

let cameraUtils = null;
try {
cameraUtils = new Camera(videoElement, {
onFrame: async () => {
await hands.send({ image: videoElement });
},
width: 640,
height: 480
});
cameraUtils.start();
} catch (e) {
console.warn("Camera init failed:", e);
}

function onHandsResults(results) {
const now = performance.now();
if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
hasHand = false;
return;
}

const landmarks = results.multiHandLandmarks[0];
hasHand = true;
lastHandTime = now;
hintEl.classList.remove("visible");

// 手掌中心（用于控制相机）
const palmIndices = [0, 5, 9, 13, 17];
let cx = 0, cy = 0;
palmIndices.forEach((i) => {
cx += landmarks[i].x;
cy += landmarks[i].y;
});
cx /= palmIndices.length;
cy /= palmIndices.length;
handCenter.x = cx;
handCenter.y = cy;

// --- 简单手势：通过指尖到手腕的平均距离判断张/握 ---
const wrist = landmarks[0];
const tipIndices = [4, 8, 12, 16, 20];
let sumDist = 0;
tipIndices.forEach((i) => {
const lm = landmarks[i];
const dx = lm.x - wrist.x;
const dy = lm.y - wrist.y;
const dz = (lm.z || 0) - (wrist.z || 0);
sumDist += Math.sqrt(dx * dx + dy * dy + dz * dz);
});
const avgDist = sumDist / tipIndices.length;

// 捏合（抓）检测：拇指指尖与食指指尖距离
const thumbTip = landmarks[4];
const indexTip = landmarks[8];
const pinchDx = thumbTip.x - indexTip.x;
const pinchDy = thumbTip.y - indexTip.y;
const pinchDz = thumbTip.z - indexTip.z;
const pinchDist = Math.sqrt(
pinchDx * pinchDx + pinchDy * pinchDy + pinchDz * pinchDz
);

const isOpen = avgDist > 0.33;
const isFist = avgDist < 0.18;
const isPinch = pinchDist < 0.07 && avgDist > 0.18 && avgDist < 0.35;

// 手势稳定帧统计
if (isOpen) {
openCounter++;
} else {
openCounter = 0;
}

if (isFist) {
fistCounter++;
} else {
fistCounter = 0;
}

if (isPinch) {
pinchCounter++;
} else {
pinchCounter = 0;
}

// 根据手势驱动状态机
handleGestureState(landmarks, { isOpen, isFist, isPinch });
}

// ========= 状态机 =========
const STATE_TREE = "TREE";
const STATE_SCATTER = "SCATTER";
const STATE_PHOTO = "PHOTO";

let currentState = STATE_TREE;
let scatterTarget = 0; // 0 = 合拢, 1 = 散开
let scatterProgress = 0;

let focusTarget = 0; // 0 = 无照片放大, 1 = 照片放大
let focusProgress = 0;

const raycaster = new THREE.Raycaster();

function setState(newState) {
if (newState === currentState) return;
currentState = newState;

switch (currentState) {
case STATE_TREE:
scatterTarget = 0;
focusTarget = 0;
hudStateEl.textContent = "STATE · TREE";
break;
case STATE_SCATTER:
scatterTarget = 1;
focusTarget = 0;
hudStateEl.textContent = "STATE · SCATTER";
break;
case STATE_PHOTO:
scatterTarget = 1;
focusTarget = 1;
hudStateEl.textContent = "STATE · PHOTO";
break;
}
}

function handleGestureState(landmarks, { isOpen, isFist, isPinch }) {
// 握拳：任何时候都回到 TREE，并退出照片放大
if (fistCounter >= GESTURE_THRESHOLD) {
setState(STATE_TREE);
return;
}

if (currentState !== STATE_PHOTO) {
// 非照片状态：张开五指 → 散开
if (openCounter >= GESTURE_THRESHOLD) {
setState(STATE_SCATTER);
}
// 散开态下：捏合 → 选一张照片并放大
if (currentState === STATE_SCATTER && scatterProgress > 0.65) {
if (pinchCounter >= GESTURE_THRESHOLD) {
tryPickPhoto(landmarks[8]); // 用食指指尖作为光标
}
}
} else {
// 照片放大态：张开手 → 退回散开态（关闭放大）
if (openCounter >= GESTURE_THRESHOLD) {
setState(STATE_SCATTER);
}
}
}

function tryPickPhoto(indexTip) {
if (!photoMeshes.length) return;

// 将 MediaPipe 归一化坐标映射为 NDC
const ndcX = indexTip.x * 2 - 1;
const ndcY = -indexTip.y * 2 + 1;

raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);
const intersects = raycaster.intersectObjects(photoMeshes, false);
if (!intersects.length) return;

const targetPhoto = intersects[0].object;
focusTexture = targetPhoto.material.map || null;
if (focusTexture && focusPlane) {
focusPlane.material.map = focusTexture;
focusPlane.material.opacity = 0; // 由动画渐显
setState(STATE_PHOTO);
}
}

// ========= 动画循环 =========
const clock = new THREE.Clock();

function animate() {
requestAnimationFrame(animate);

const dt = clock.getDelta();
const t = clock.elapsedTime;

// 没有手很久 → 显示提示
if (!hasHand && performance.now() - lastHandTime > 2500) {
hintEl.classList.add("visible");
}

// 进度插值（带平滑）
scatterProgress += (scatterTarget - scatterProgress) * 0.065;
focusProgress += (focusTarget - focusProgress) * 0.09;

// 用一个平滑曲线而不是线性插值，做“过波”感
const s = smoothStep(scatterProgress);
const f = smoothStep(focusProgress);

// 粒子位置插值
const posAttr = particleGeom.getAttribute("position");
for (let i = 0; i < PARTICLE_COUNT; i++) {
const i3 = i * 3;
const tx = particleTreePositions[i3];
const ty = particleTreePositions[i3 + 1];
const tz = particleTreePositions[i3 + 2];

const sx = particleScatterPositions[i3];
const sy = particleScatterPositions[i3 + 1];
const sz = particleScatterPositions[i3 + 2];

// 在插值上再做一点轻微正弦扰动，形成闪烁波动
const wiggle = Math.sin(t * 1.8 + i * 0.27) * 0.12 * s;
posAttr.array[i3] = THREE.MathUtils.lerp(tx, sx, s) + wiggle;
posAttr.array[i3 + 1] =
THREE.MathUtils.lerp(ty, sy, s) + Math.cos(t * 1.6 + i * 0.19) * 0.09 * s;
posAttr.array[i3 + 2] = THREE.MathUtils.lerp(tz, sz, s);
}
posAttr.needsUpdate = true;

// 装饰物插值 + 摇摆
ornaments.forEach((o, i) => {
const { mesh, treePos, scatterPos, wiggleOffset } = o;
const basePos = new THREE.Vector3().lerpVectors(treePos, scatterPos, s);

const wobbleAmp = 0.12 + 0.1 * s;
const wobble = Math.sin(t * 2 + wiggleOffset) * wobbleAmp;
const wobbleUp =
Math.cos(t * 2.2 + i * 0.37 + wiggleOffset) * wobbleAmp * 0.35;

mesh.position.set(
basePos.x + wobble,
basePos.y + wobbleUp,
basePos.z
);

// 散开时略微自转
if (s > 0.15) {
mesh.rotation.y += 0.4 * dt * (0.5 + Math.random() * 0.5);
}

// 顶部星星额外旋转
if (mesh.userData.isStar) {
mesh.rotation.y += 0.6 * dt;
}
});

// 焦点照片 plane
if (focusPlane) {
if (f > 0.02 && focusTexture) {
focusPlane.visible = true;
focusPlane.material.opacity = 0.98 * f;
} else {
focusPlane.material.opacity = 0;
focusPlane.visible = false;
}

const baseY = 3.3;
const floatY = baseY + Math.sin(t * 1.4) * 0.18 * f;
const baseScale = 1.2 + 1.6 * f;
focusPlane.position.y = floatY;
focusPlane.scale.set(baseScale, baseScale, 1);

// 轻微水平漂浮
focusPlane.position.x = Math.sin(t * 0.7) * 0.25 * f;
}

// 相机控制（手势优先，其次自动旋转）
if (hasHand && currentState !== STATE_TREE) {
const hx = (handCenter.x - 0.5) * 2; // -1 ~ 1
const hy = (handCenter.y - 0.5) * 2;
const maxThetaOffset = 1.1;
const maxPhiOffset = 0.55;

camThetaTarget = baseTheta + hx * maxThetaOffset;
camPhiTarget = THREE.MathUtils.clamp(
basePhi + hy * maxPhiOffset,
0.7,
1.4
);
} else {
// 没手时轻微自动旋转
camThetaTarget = baseTheta + Math.sin(t * 0.08) * 0.35;
camPhiTarget = basePhi + Math.sin(t * 0.11) * 0.08;
}

camTheta += (camThetaTarget - camTheta) * 0.08;
camPhi += (camPhiTarget - camPhi) * 0.08;

const x = camRadius * Math.sin(camPhi) * Math.cos(camTheta);
const y = camRadius * Math.cos(camPhi) + 1.6;
const z = camRadius * Math.sin(camPhi) * Math.sin(camTheta);

camera.position.set(x, y, z);
camera.lookAt(0, TREE_HEIGHT / 2, 0);

composer.render();
}

function smoothStep(t) {
t = THREE.MathUtils.clamp(t, 0, 1);
return t * t * (3 - 2 * t);
}

// ========= 事件与初始化 =========
window.addEventListener("resize", () => {
const w = window.innerWidth;
const h = window.innerHeight;
camera.aspect = w / h;
camera.updateProjectionMatrix();
renderer.setSize(w, h);
composer.setSize(w, h);
bloomPass.setSize(w, h);
});

// 初始化场景元素
createParticleTree();
createOrnaments();
initFocusPlane();

// 初始提示
hintEl.classList.add("visible");

// 启动动画循环
animate();
</script>
</body>
</html>
